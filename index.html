:root {
  --police: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --encre: #17131f;
  --ombre-texte: 0 3px 0 rgba(0,0,0,.55), 0 0 10px rgba(0,0,0,.35);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #120c18; overflow: hidden; font-family: var(--police); color: #fff; }

#stage {
  position: absolute; left: 50%; top: 50%;
  width: 1080px; height: 1920px;
  transform-origin: center center; transform: translate(-50%, -50%);
  overflow: hidden;
}
#monde { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#hud { position: absolute; inset: 0; pointer-events: none; }

/* ---------- Barre de progression du haut ---------- */
#carte { position: absolute; top: 168px; left: 60px; right: 60px; height: 190px; }
#carte .immeuble {
  position: absolute; top: 34px; width: 74px; height: 104px;
  background: #15111c; border-radius: 10px;
  box-shadow: 0 6px 0 rgba(0,0,0,.25), inset 0 0 0 3px rgba(255,255,255,.06);
}
#carte .gauche { left: 0; }
#carte .droite { right: 0; }
#carteCorde { position: absolute; left: 74px; right: 74px; top: 36px; width: calc(100% - 148px); height: 60px; overflow: visible; }
#carteCorde path { fill: none; stroke: #fff7ee; stroke-width: 7; stroke-linecap: round; filter: drop-shadow(0 3px 0 rgba(0,0,0,.3)); }
#carteBonhomme { position: absolute; top: 0; width: 0; height: 0; transition: left .25s linear, top .25s linear; }
#carteBonhomme i {               /* tête */
  position: absolute; left: -17px; top: -40px; width: 34px; height: 34px; border-radius: 50%;
  background: #15111c; box-shadow: 0 0 0 4px #fff7ee;
}
#carteBonhomme b {               /* perche */
  position: absolute; left: -38px; top: -6px; width: 76px; height: 7px; border-radius: 4px; background: #15111c;
}
#carteDistance {
  position: absolute; top: 0; transform: translateX(-50%); margin-top: 18px;
  font-size: 54px; font-weight: 800; white-space: nowrap; text-shadow: var(--ombre-texte);
  transition: left .25s linear, top .25s linear;
}
#carteVictoires, #carteBut {
  position: absolute; top: 140px; font-size: 32px; font-weight: 800; text-shadow: var(--ombre-texte); white-space: nowrap;
}
#carteVictoires { left: -6px; }
#carteBut { right: 0; }
#carteVictoires.bump { animation: bump .6s ease-out; }
@keyframes bump { 30% { transform: scale(1.5); color: #ffe066; } }

/* ---------- Petite bannière ---------- */
#banniere {
  position: absolute; top: 352px; left: 50%; transform: translateX(-50%);
  padding: 4px 26px 6px; border-radius: 30px;
  background: rgba(23, 19, 31, .62); border: 3px solid rgba(255,255,255,.25);
  white-space: nowrap;
}
#banniere span { font-size: 32px; font-weight: 800; text-shadow: var(--ombre-texte); }
#banniere.change span { animation: rebond .45s ease-out; display: inline-block; }
@keyframes rebond { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: none; } }

/* ---------- Les cadeaux en deux panneaux : AIDE (vert, à gauche) / SABOTAGE (rouge, à droite) ---------- */
.legende {
  position: absolute; top: 900px; width: 345px;
  padding: 6px 10px 8px 8px; border-radius: 22px;
  background: rgba(23, 19, 31, .58);
}
.legende.aide { left: 10px; border: 4px solid #40c057; }
.legende.sabotage { right: 10px; border: 4px solid #fa5252; }
.legende h3 {
  margin: 0 -10px 6px -8px; padding: 2px 0 4px; border-radius: 16px 16px 0 0;
  text-align: center; font-size: 30px; font-weight: 800; line-height: 1.15; text-shadow: var(--ombre-texte);
}
.legende.aide h3 { background: #2f9e44; }
.legende.sabotage h3 { background: #e03131; }
.ligne {
  display: grid; grid-template-columns: 42px 1fr auto; align-items: center; column-gap: 6px;
  height: 44px; padding: 0 2px; border-radius: 12px;
}
.ligne .emo { font-size: 32px; line-height: 1; text-align: center; filter: drop-shadow(0 2px 0 rgba(0,0,0,.4)); }
.ligne .nom { font-size: 20px; font-weight: 800; line-height: 1; text-transform: uppercase; text-shadow: var(--ombre-texte); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ligne .tag { font-size: 24px; font-weight: 800; white-space: nowrap; text-shadow: var(--ombre-texte); }
.ligne.aide .tag { color: #8cf08c; }
.ligne.sabotage .tag { color: #ff6b6b; }
.ligne .tag.pastille { font-size: 18px; padding: 2px 10px; border-radius: 8px; color: #fff; text-shadow: none; }
.ligne .tag.bleu { background: #339af0; }
.ligne .tag.vert { background: #2fb344; }
.ligne .tag.rouge { background: #f03e3e; }
.ligne .tag.marron { background: #8d6e63; }
.ligne.flash { animation: flash 1.1s ease-out; }
@keyframes flash { 0% { background: rgba(255,255,255,.0); } 12% { background: rgba(255,255,255,.5); transform: scale(1.06); } 100% { background: rgba(255,255,255,0); transform: none; } }

/* ---------- Likes regroupés par personne ---------- */
#likesZone {                     /* au milieu, entre les deux panneaux */
  position: absolute; left: 365px; top: 1040px; width: 350px; height: 340px;
  display: flex; flex-direction: column-reverse; align-items: center; gap: 10px; pointer-events: none;
}
.likeBulle {
  max-width: 350px; display: flex; align-items: center; gap: 8px; padding: 2px 18px 4px 10px;
  background: rgba(23, 19, 31, .68); border: 3px solid rgba(255, 140, 170, .8); border-radius: 26px;
  font-size: 27px; font-weight: 800; white-space: nowrap; text-shadow: var(--ombre-texte);
  animation: likeEntree .35s ease-out; transition: opacity .5s, transform .5s;
}
.likeBulle .qui { overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
.likeBulle .combien { color: #ff8fab; }
.likeBulle.bump .combien { animation: bump .35s ease-out; display: inline-block; }
.likeBulle.part { opacity: 0; transform: translateX(-40px); }
@keyframes likeEntree { from { transform: translateX(-60px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Grands tampons (+1 VICTOIRE, CHUTE, SAUVÉ...) ---------- */
#tampons { position: absolute; left: 0; right: 0; top: 560px; height: 300px; pointer-events: none; }
.tampon {
  position: absolute; left: 50%; top: 40px;
  padding: 6px 34px 10px; border-radius: 10px;
  font-size: 92px; font-weight: 800; line-height: 1; white-space: nowrap; color: #fff;
  background: #e03131; border: 6px solid #fff;
  box-shadow: 0 10px 0 rgba(0,0,0,.35);
  text-shadow: 0 5px 0 rgba(0,0,0,.35);
  transform: translateX(-50%) rotate(-6deg);
  animation: tampon 2.4s forwards;
}
.tampon small { display: block; font-size: 36px; text-align: center; margin-top: 2px; }
.tampon.bleu { background: #1c7ed6; }
.tampon.vert { background: #2f9e44; }
.tampon.noir { background: #212529; }
@keyframes tampon {
  0% { opacity: 0; transform: translateX(-50%) rotate(-6deg) scale(2.6); }
  10% { opacity: 1; transform: translateX(-50%) rotate(-6deg) scale(.92); }
  16% { transform: translateX(-50%) rotate(-6deg) scale(1); }
  85% { opacity: 1; transform: translateX(-50%) rotate(-6deg) scale(1); }
  100% { opacity: 0; transform: translateX(-50%) rotate(-6deg) scale(1.1) translateY(-30px); }
}

/* ---------- Mode DÉMO, pastille de connexion, message son (hors de la scène) ---------- */
#demo {
  position: fixed; right: 14px; bottom: 14px; width: 250px; padding: 12px;
  display: flex; flex-direction: column; gap: 6px;
  background: rgba(18, 12, 24, .95); color: #fff; border: 2px solid #ffc857; border-radius: 14px;
  font-size: 16px; z-index: 10;
}
#demo.cache { display: none; }
#demo button { font: inherit; font-weight: 700; padding: 6px 10px; border: 0; border-radius: 10px; background: #ffc857; color: #2a1a00; cursor: pointer; }
#demo button:hover { filter: brightness(1.1); }
#demo button:focus-visible { outline: 3px solid #fff; }
#demo button.actif { background: #69db7c; }

<script>
/* ===== son.js ===== */
"use strict";
/* ============================================================
   son.js — LES SONS ET LA MUSIQUE

   Tout est fabriqué par le navigateur (aucun fichier audio) :
     - un son pour chaque alerte (abonné, cadeau, cadeau spécial, palier de likes)
     - une musique de fond joyeuse qui tourne en boucle
   Pour utiliser TA musique à la place : voir "sons" dans config.js.
   ============================================================ */
(function () {

  const S = Object.assign({ actif: true, volumeEffets: 0.8, commentaire: false }, CONFIG.sons || {});
  S.musique = Object.assign({ actif: true, volume: 0.25, fichier: "" }, (CONFIG.sons || {}).musique || {});

  const hint = document.getElementById("sonHint");
  let ac = null, fx = null, mus = null, analyseur = null;
  let musiqueActive = S.musique.actif;
  let fichierAudio = null;

  const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);   // numéro de note -> fréquence

  /* ---------- Une note : un son court qui s'éteint doucement ---------- */
  function note(freq, t, duree, type, vol, dest, harmonique) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.012 + duree);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + duree + 0.08);
    if (harmonique) note(freq * 2, t, duree * 0.6, "sine", vol * 0.35, dest, false);
  }

  /* ---------- Les sons des alertes ---------- */
  const EFFETS = {
    abonne: (t) => [72, 76, 79, 84].forEach((m, i) => note(hz(m), t + i * 0.08, 0.3, "triangle", 0.34, fx, true)),
    cadeau: (t) => {                                          // petit "ding" de pièce
      note(hz(83), t, 0.12, "square", 0.12, fx, false);
      note(hz(88), t + 0.07, 0.4, "square", 0.12, fx, false);
      note(hz(95), t + 0.15, 0.3, "triangle", 0.12, fx, false);
    },
    special: (t) => {                                         // fanfare
      [60, 64, 67, 72, 76, 79, 84].forEach((m, i) => note(hz(m), t + i * 0.09, 0.3, "triangle", 0.3, fx, true));
      [72, 76, 79, 84].forEach((m) => note(hz(m), t + 0.7, 1.3, "triangle", 0.2, fx, true));
    },
    like: (t) => [79, 83, 86, 91].forEach((m, i) => note(hz(m), t + i * 0.09, 0.35, "sine", 0.34, fx, true)),
    commentaire: (t) => note(hz(81), t, 0.09, "sine", 0.14, fx, false),
    detrone: (t) => {                                         // "ouh !" qui descend puis fanfare du nouveau roi
      [79, 74, 70, 67].forEach((m, i) => note(hz(m), t + i * 0.07, 0.16, "square", 0.08, fx, false));
      [60, 67, 72, 76, 79, 84].forEach((m, i) => note(hz(m), t + 0.36 + i * 0.07, 0.32, "triangle", 0.3, fx, true));
      [72, 76, 79].forEach((m) => note(hz(m), t + 0.8, 0.9, "triangle", 0.18, fx, true));
    },
    victoire: (t) => {                                        // grande fanfare de fin de manche
      [67, 67, 67, 72].forEach((m, i) => note(hz(m), t + [0, 0.15, 0.3, 0.45][i], i === 3 ? 0.6 : 0.12, "triangle", 0.32, fx, true));
      [76, 79, 84].forEach((m, i) => note(hz(m), t + 1.1 + i * 0.12, 0.4, "triangle", 0.3, fx, true));
      [72, 76, 79, 84].forEach((m) => note(hz(m), t + 1.5, 1.6, "triangle", 0.16, fx, true));
    },
    tic: (t) => note(hz(96), t, 0.05, "square", 0.1, fx, false),
    canon: (t) => {                                           // "boum" grave
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.35);
      g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.connect(g); g.connect(fx); o.start(t); o.stop(t + 0.45);
    }
  };

  function jouer(nom) {
    if (!S.actif || !ac || ac.state !== "running" || !EFFETS[nom]) return;
    if (nom === "commentaire" && !S.commentaire) return;
    EFFETS[nom](ac.currentTime + 0.02);
  }

  /* ---------- La musique de fond : do - la mineur - fa - sol, en boucle ---------- */
  const PAS = 60 / 104 / 2;                                   // durée d'une croche à 104 battements/minute
  const ACCORDS = [
    { basse: 48, notes: [60, 64, 67] },                       // do majeur
    { basse: 45, notes: [57, 60, 64] },                       // la mineur
    { basse: 41, notes: [57, 60, 65] },                       // fa majeur
    { basse: 43, notes: [59, 62, 67] }                        // sol majeur
  ];
  const MELODIES = [                                          // 8 croches par mesure, 0 = silence
    [76, 0, 79, 76, 74, 0, 72, 0],
    [72, 0, 76, 0, 81, 79, 76, 0],
    [69, 72, 0, 76, 74, 0, 72, 0],
    [74, 0, 79, 0, 77, 76, 74, 0]
  ];
  let prochain = 0, mesure = 0, minuterie = null;

  function jouerMesure(t, i) {
    const a = ACCORDS[i], m = MELODIES[i];
    note(hz(a.basse), t, 0.5, "triangle", 0.30, mus, false);
    note(hz(a.basse), t + 4 * PAS, 0.5, "triangle", 0.24, mus, false);
    [1, 3, 5, 7].forEach((s) => a.notes.forEach((n) => note(hz(n), t + s * PAS, 0.2, "triangle", 0.05, mus, false)));
    m.forEach((n, s) => { if (n) note(hz(n), t + s * PAS, 0.34, "sine", 0.16, mus, true); });
  }
  function planifier() {                                      // prépare les mesures à venir
    if (!ac || ac.state !== "running" || !musiqueActive || fichierAudio) return;
    while (prochain < ac.currentTime + 0.7) {
      jouerMesure(prochain, mesure % 4);
      prochain += 8 * PAS; mesure++;
    }
  }
  function demarrerMusique() {
    if (fichierAudio) { if (musiqueActive) fichierAudio.play().catch(() => {}); return; }
    if (minuterie) return;
    prochain = ac.currentTime + 0.15; mesure = 0;
    minuterie = setInterval(planifier, 120);
  }

  function basculerMusique() {
    musiqueActive = !musiqueActive;
    if (fichierAudio) { if (musiqueActive) fichierAudio.play().catch(() => {}); else fichierAudio.pause(); }
    else if (mus) {
      mus.gain.setTargetAtTime(musiqueActive ? S.musique.volume : 0, ac.currentTime, 0.2);
      if (musiqueActive) { prochain = Math.max(prochain, ac.currentTime + 0.15); }
    }
    const b = document.getElementById("btnMusique");
    if (b) b.textContent = musiqueActive ? "Musique : activée (N)" : "Musique : coupée (N)";
  }

  /* ---------- Mise en route (les navigateurs exigent parfois un clic) ---------- */
  function majHint() {
    const bloque = S.actif && ((ac && ac.state !== "running") || (fichierAudio && fichierAudio.paused && musiqueActive));
    if (hint) hint.className = bloque && !/[?&]app=1/.test(location.search) ? "sonHint" : "sonHint cache";
  }
  function debloquer() {
    if (ac && ac.state !== "running") ac.resume();
    if (fichierAudio && musiqueActive && fichierAudio.paused) fichierAudio.play().then(majHint).catch(() => {});
    setTimeout(majHint, 300);
  }

  function init() {
    if (!S.actif) { majHint(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    const maitre = ac.createGain(), comp = ac.createDynamicsCompressor();
    fx = ac.createGain(); fx.gain.value = S.volumeEffets;
    mus = ac.createGain(); mus.gain.value = musiqueActive ? S.musique.volume : 0;
    analyseur = ac.createAnalyser(); analyseur.fftSize = 512;
    fx.connect(maitre); mus.connect(maitre); maitre.connect(comp); comp.connect(analyseur); comp.connect(ac.destination);
    if (S.musique.fichier) {                                  // ta propre musique
      fichierAudio = new Audio(S.musique.fichier);
      fichierAudio.loop = true; fichierAudio.volume = Math.min(1, S.musique.volume * 2);
      fichierAudio.addEventListener("play", majHint);
    }
    ac.onstatechange = () => { if (ac.state === "running") demarrerMusique(); majHint(); };
    if (ac.state === "running") demarrerMusique();
    else if (fichierAudio && musiqueActive) fichierAudio.play().then(majHint).catch(() => {});
    ["pointerdown", "keydown", "touchstart"].forEach((e) => window.addEventListener(e, debloquer));
    setTimeout(majHint, 500);
  }

  const btn = document.getElementById("btnMusique");
  if (btn) btn.addEventListener("click", basculerMusique);
  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key.toLowerCase() === "n") basculerMusique();
  });

  window.Son = {
    jouer: jouer,
    niveau: () => {                                           // volume sortant (pour les tests)
      if (!analyseur) return 0;
      const d = new Uint8Array(analyseur.fftSize); analyseur.getByteTimeDomainData(d);
      let max = 0; d.forEach((v) => { max = Math.max(max, Math.abs(v - 128)); }); return max;
    },
    etat: () => (ac ? ac.state : "aucun"),
    basculerMusique: basculerMusique
  };
  init();
})();

</script>
<script>
/* ===== game.js ===== */
"use strict";
/* ============================================================
   game.js — LE FUNAMBULE

   Le principe :
     - Un funambule traverse une corde entre deux immeubles (80 m par défaut).
     - Les cadeaux VERTS l'aident (il avance, filet de sécurité, arrivée directe...).
     - Les cadeaux ROUGES le sabotent (il recule, il tombe, on vole des victoires...).
     - Les likes, abonnements et partages le font aussi avancer.
     - Arrivé au bout : +1 VICTOIRE, et on recommence à 0 m.
     - Ceux qui participent apparaissent sur le toit d'en face (avec leur photo).

   Plan du fichier :
     1. Outils                    4. Règles du jeu
     2. État + sauvegarde         5. Écran (barre du haut, légende, tampons)
     3. Dessin (scène, funambule) 6. Mode DÉMO et démarrage
   ============================================================ */
(function () {

  /* ==========================================================
     1. OUTILS
     ========================================================== */
  const L = 1080, H = 1920;
  const CLE_SAUVEGARDE = "funambule_v1";
  const POLICE = "'Baloo 2','Trebuchet MS','Segoe UI',sans-serif";
  const NOIR = "#17131f";
  const canvas = document.getElementById("monde");
  const ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);
  const MODE_APP = new URLSearchParams(location.search).get("app") === "1";
  const BUT = Math.max(10, CONFIG.distanceBut || 80);
  let q = 1;

  const aleatoire = (a, b) => a + Math.random() * (b - a);
  const choisir = (liste) => liste[Math.floor(Math.random() * liste.length)];
  const borne = (v, a, b) => Math.max(a, Math.min(b, v));
  const son = (nom) => { if (window.Son) window.Son.jouer(nom); };
  function easeOutBack(x) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
  function hash(t) { let h = 2166136261 >>> 0; t = String(t); for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
  function generateurAlea(g) { let s = g; return () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; }; }
  function hexVersRvb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function melange(a, b, t) {                       // mélange de deux couleurs (brume au loin)
    const A = hexVersRvb(a), B = hexVersRvb(b); t = borne(t, 0, 1);
    return "rgb(" + Math.round(A[0] + (B[0] - A[0]) * t) + "," + Math.round(A[1] + (B[1] - A[1]) * t) + "," + Math.round(A[2] + (B[2] - A[2]) * t) + ")";
  }
  function poly(pts, fill) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
  function rond(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
  function texteContour(t, x, y, taille, couleur, ep) {
    ctx.font = "800 " + taille + "px " + POLICE; ctx.textAlign = "center"; ctx.lineJoin = "round";
    ctx.lineWidth = ep || 7; ctx.strokeStyle = "rgba(20,12,24,.85)"; ctx.strokeText(t, x, y);
    ctx.fillStyle = couleur || "#fff"; ctx.fillText(t, x, y); ctx.textAlign = "start";
  }

  /* ---------- Perspective : la caméra est derrière le funambule ---------- */
  const HORIZON = 560, FOCALE = 520, CAM_Y = 2.8, CAM_X = 0.3, Z_MARCHEUR = 3.4;
  function proj(x, y, z) { const s = FOCALE / z; return [540 + (x - CAM_X) * s, HORIZON + (CAM_Y - y) * s, s]; }

  /* ==========================================================
     2. ÉTAT + SAUVEGARDE
     ========================================================== */
  function etatInitial() {
    return { v: 1, distance: 0, victoires: 0, filets: 0, traversee: 0, spectateurs: [], likesReste: 0, crottes: { g: 0, d: 0 } };
  }
  let etat = etatInitial(), sauvegardeSale = false;

    b.minuterie = setTimeout(() => { b.el.classList.add("part"); setTimeout(() => b.el.remove(), 500); bullesLikes.delete(cle); }, 3000);
    gerbeDeCoeurs(Math.min(20, 4 + Math.round(Math.sqrt(n) * 3)));
  }
  function like(pseudoBrut, quantite, url) {
    const n = Math.max(1, Math.floor(Number(quantite) || 1));
    const pseudo = pseudoBrut ? nettoyerPseudo(pseudoBrut) : "Quelqu'un";
    if (pseudoBrut) surLeToit(pseudo, url);
    montrerLikes(pseudo, n);
    etat.likesReste += n;
    const par = Math.max(1, CONFIG.likesParMetre || 30);
    const m = Math.floor(etat.likesReste / par);
    if (m > 0) { etat.likesReste -= m * par; bouger(m); texteFlottant("❤️ les likes", "+" + m + " m", "#ff8fab", 52); }
    sauvegardeSale = true;
  }
  function commentaire(pseudoBrut, texteBrut, url) {
    const pseudo = nettoyerPseudo(pseudoBrut);
    const texte = String(texteBrut == null ? "" : texteBrut).replace(/[\u0000-\u001f]/g, " ").trim().slice(0, 120);
    if (!texte) return;
    surLeToit(pseudo, url);
    const f = foule.find((x) => x.cle === pseudo.toLowerCase());
    if (f) f.bulle = { texte: texte.length > 28 ? texte.slice(0, 27) + "…" : texte, fin: temps + 5 };
    son("commentaire");
  }
  function partage(pseudoBrut, url) {
    const pseudo = nettoyerPseudo(pseudoBrut);
    surLeToit(pseudo, url);
    const m = CONFIG.metresPartage || 0;
    if (m) { bouger(m); texteFlottant(pseudo + " partage le live", "+" + m + " m", "#8cf08c", 52); }
  }
  function reinitialiser() {
    etat = etatInitial(); pos = 0; phase = "jeu"; report = 0;
    effets = []; confettis = []; coeurs = []; textes = []; foule = [];
    bullesLikes.forEach((v) => clearTimeout(v.minuterie)); bullesLikes.clear(); $("likesZone").textContent = "";
    $("tampons").textContent = ""; sauver(); majVictoires(false);
  }

  // ---------- Avancer le funambule, gagner, tomber ----------
  function majJeu(dt) {
    if (phase === "jeu") {
      const ecart = etat.distance - pos;
      const v = Math.sign(ecart) * Math.min(Math.abs(ecart), (CONFIG.vitesse || 6) * dt * (1 + Math.abs(ecart) / 8) * (jetpack > 0 ? 2.5 : 1));
      pos += v; vitesseVue = v / Math.max(dt, 0.001);
      pasPhase += Math.abs(v) * 2.2;

        etat.victoires++; majVictoires(true);
        tampon("+1 VICTOIRE !", "", "le funambule est arrivé !"); lancerConfettis(220); son("victoire");
        sauvegardeSale = true;
      }
    } else {
      tPhase += dt; vitesseVue = 0;
      if ((phase === "victoire" && tPhase > 2.8) || (phase === "chute" && tPhase > 1.7)) {
        // nouvelle traversée depuis 0 m (avec ce qui a été offert entre-temps)
        etat.traversee++; pos = 0; etat.distance = borne(report, 0, BUT - 1); report = 0;
        etat.crottes = { g: 0, d: 0 };
        phase = "jeu"; apparition = temps; sauvegardeSale = true;
      }
    }
  }

  /* ==========================================================
     5. ÉCRAN
     ========================================================== */
  function construireLegende() {
    const panAide = $("legendeAide"), panSabot = $("legendeSabotage");
    panAide.textContent = ""; panSabot.textContent = "";
    const titre = (pan, t) => { const h = document.createElement("h3"); h.textContent = t; pan.appendChild(h); };
    titre(panAide, "🟢 AIDE"); titre(panSabot, "🔴 SABOTAGE");
    const ligne = (classe, emoji, nom, tag, pastille, cle) => {
      const leg = classe === "aide" ? panAide : panSabot;
      const d = document.createElement("div"); d.className = "ligne " + classe; if (cle) d.dataset.cadeau = cle;
      const e = document.createElement("span"); e.className = "emo"; e.textContent = emoji;
      const n = document.createElement("span"); n.className = "nom"; n.textContent = nom;
      const t = document.createElement("span"); t.className = "tag" + (pastille ? " pastille " + pastille : ""); t.textContent = tag;
      d.append(e, n, t); leg.appendChild(d);
    };
    ligne("aide", "❤️", "×" + (CONFIG.likesParMetre || 30) + " likes", "+1m");
    const tagDe = (c) => {
      switch (c.effet) {
        case "avance": return ["+" + c.valeur + "m", ""];
        case "recule": return ["−" + c.valeur + "m", ""];
        case "bouclier": return ["FILET", "bleu"];
        case "arrivee": return ["ARRIVÉE", "vert"];
        case "victoire": return ["+" + (c.valeur || 1) + " VICT.", "vert"];
        case "chute": return ["CHUTE !", "rouge"];
        case "volVictoires": return ["−" + (c.valeur || 1) + " VICT.", "rouge"];
      }
      return ["", ""];
    };
    const aides = CADEAUX.filter((c) => AIDE.indexOf(c.effet) >= 0), sabot = CADEAUX.filter((c) => AIDE.indexOf(c.effet) < 0);
    aides.forEach((c) => { const t = tagDe(c); ligne("aide", c.emoji || "🎁", c.cadeau, t[0], t[1], c.cadeau.toLowerCase()); });
    if (CONFIG.crottesAbonnement !== false) ligne("sabotage", "💩", "Abonnement", "CROTTE", "marron");
    sabot.forEach((c) => { const t = tagDe(c); ligne("sabotage", c.emoji || "🎁", c.cadeau, t[0], t[1], c.cadeau.toLowerCase()); });
  }

  function tampon(texte, couleur, sous) {
    const zone = $("tampons");
    const d = document.createElement("div"); d.className = "tampon " + (couleur || "");
    d.textContent = texte;
    if (sous) { const s = document.createElement("small"); s.textContent = sous; d.appendChild(s); }
    zone.textContent = ""; zone.appendChild(d);
    setTimeout(() => d.remove(), 2400);
  }

  function majVictoires(anim) {
    const el = $("carteVictoires"); el.textContent = "Victoires " + etat.victoires;
    if (anim) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
  }

  let derniereCarte = -1;
  function majCarte() {
    const metres = Math.round(pos);
    const t = borne(pos / BUT, 0, 1);
    const largeur = $("carte").clientWidth - 148;
    const x = 74 + t * largeur;
    const yy = (1 - t) * (1 - t) * 8 + 2 * (1 - t) * t * 52 + t * t * 8;   // la corde de la carte est courbée
    const y = 36 + yy;
    if (metres !== derniereCarte) { $("carteDistance").textContent = metres + " m"; derniereCarte = metres; }
    $("carteBonhomme").style.left = x + "px"; $("carteBonhomme").style.top = y + "px";
    $("carteDistance").style.left = borne(x, 120, largeur + 30) + "px"; $("carteDistance").style.top = (y + 4) + "px";
  }

  let banIndex = -1;
  function banniereSuivante() {
    const msgs = CONFIG.messagesBanniere || []; if (!msgs.length) { $("banniere").style.display = "none"; return; }
    banIndex = (banIndex + 1) % msgs.length;
    $("banniere").className = ""; void $("banniere").offsetWidth; $("banniere").className = "change";
    $("banniereTexte").textContent = msgs[banIndex];
  }

  function ajusterTaille() {
    const k = Math.min(window.innerWidth / L, window.innerHeight / H);
    $("stage").style.transform = "translate(-50%, -50%) scale(" + k + ")";
    const nq = Math.min(2, Math.max(1, Math.ceil(k * (window.devicePixelRatio || 1) * 4) / 4));
    if (nq !== q || canvas.width !== Math.round(L * q)) { q = nq; canvas.width = Math.round(L * q); canvas.height = Math.round(H * q); construireFond(); }
  }

  /* ==========================================================
     6. MODE DÉMO + DÉMARRAGE
     ========================================================== */
  const PSEUDOS = ["Lucas", "Camille", "Zoé", "Hugo", "Léa", "Nathan", "Chloé", "Louis", "Manon", "Jules", "Inès", "Gabriel", "Sarah", "Tom", "Emma",
                   "Adam", "Lola", "Noah", "Alice", "Maxime", "Clara", "Théo", "Jade", "Enzo", "Lina", "Raphaël", "Mila", "Yanis", "Anna", "Axel"];
  const MESSAGES = ["Allez il va y arriver !", "nono nono nono", "Je vais le faire tomber 😈", "Vas-y champion !", "Il tremble 😂", "Encore un peu !!", "Salut tout le monde 👋", "Pas le pigeon 😭"];
  function pseudoAleatoire() { return choisir(PSEUDOS) + choisir(["", "", "_92", "TV", "_off", "57", "_fr"]) + (Math.random() < 0.4 ? Math.floor(Math.random() * 100) : ""); }
  function pseudoExistant() { return etat.spectateurs.length && Math.random() < 0.75 ? choisir(etat.spectateurs).pseudo : pseudoAleatoire(); }
  const demo = {
    abonne: () => ajouterHabitant(pseudoAleatoire()),
    cadeau: () => { const c = choisir(CADEAUX.filter((x) => x.effet === "avance" || (Math.random() < 0.15 && AIDE.indexOf(x.effet) >= 0))); if (c) cadeau(pseudoExistant(), c.cadeau, 1, 1); },
    special: () => { const c = choisir(CADEAUX.filter((x) => AIDE.indexOf(x.effet) < 0 && (x.effet === "recule" || Math.random() < 0.3))); if (c) cadeau(pseudoExistant(), c.cadeau, 1, 1); },
    likes: () => like(pseudoExistant(), Math.floor(aleatoire(10, 60))),
    commentaire: () => commentaire(pseudoExistant(), choisir(MESSAGES)),
    finirManche: () => { const c = CADEAUX.find((x) => x.effet === "arrivee"); if (c) cadeau(pseudoExistant(), c.cadeau, 1, 1); else bouger(BUT); }
  };
  let minuterieAuto = null;
  function basculerAutoDemo() {
    if (minuterieAuto) { clearInterval(minuterieAuto); minuterieAuto = null; }
    else minuterieAuto = setInterval(() => {

    $("btnAuto").classList.toggle("actif", !!minuterieAuto);
    $("btnAuto").textContent = minuterieAuto ? "Arrêter la démo auto (P)" : "Démo automatique (P)";
  }
  function demanderReset() { if (window.confirm("Remettre les victoires et les spectateurs à zéro ?")) reinitialiser(); }
  function brancherDemo() {
    $("btnAbonne").addEventListener("click", demo.abonne);
    $("btnCadeau").addEventListener("click", demo.cadeau);
    $("btnSpecial").addEventListener("click", demo.special);
    $("btnLikes").addEventListener("click", demo.likes);
    $("btnMessage").addEventListener("click", demo.commentaire);
    $("btnFin").addEventListener("click", demo.finirManche);
    $("btnAuto").addEventListener("click", basculerAutoDemo);
    $("btnReset").addEventListener("click", demanderReset);
    if (!CONFIG.afficherPanneauDemo || MODE_APP) $("demo").classList.add("cache");
    window.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      switch (e.key.toLowerCase()) {
        case "a": demo.abonne(); break;
        case "c": demo.cadeau(); break;
        case "s": demo.special(); break;
        case "l": demo.likes(); break;
        case "m": demo.commentaire(); break;
        case "f": demo.finirManche(); break;
        case "p": basculerAutoDemo(); break;
        case "d": $("demo").classList.toggle("cache"); break;
        case "r": demanderReset(); break;
      }
    });
  }
  window.Demo = Object.assign({ auto: basculerAutoDemo, panneau: () => $("demo").classList.toggle("cache") }, demo);
  // Les fonctions appelées par la connexion au live (tikfinity.js)
  window.Village = {
    ajouterHabitant: ajouterHabitant, cadeau: cadeau, like: like, commentaire: commentaire, partage: partage,
    reinitialiser: reinitialiser, etat: () => etat, position: () => pos, phase: () => phase
  };

  function demarrer() {
    charger();
    pos = etat.distance;
    document.title = CONFIG.titre || "Le Funambule";
    $("carteBut").textContent = BUT + " m";
    ajusterTaille(); if (!fond) construireFond();
    construireLegende(); majVictoires(false);
    synchroniserFoule(); foule.forEach((f) => { f.t0 = -100; });
    banniereSuivante(); setInterval(banniereSuivante, CONFIG.dureeBanniereMs || 4000);

    window.addEventListener("beforeunload", sauver);
    document.addEventListener("visibilitychange", () => { if (document.hidden) sauver(); });

      dernier = maintenant; temps += dt;
      majJeu(dt); majEffets(dt); majCarte();

  }

  Promise.race([polices, new Promise((r) => setTimeout(r, 1500))]).then(demarrer);
})();

<script>
/* ===== tikfinity.js ===== */
"use strict";
/* ============================================================
   tikfinity.js — CONNEXION À TIKFINITY  (étape 2)

   Schéma :  TikTok LIVE -> application TikFinity -> ws://localhost:21213/
             -> ce fichier -> les fonctions du village (game.js)

   Chaque message reçu ressemble à : {"event":"gift","data":{...}}
   Ce fichier le lit et appelle la bonne fonction du village.
   ============================================================ */
(function () {

  // Réglages (modifiables dans config.js, bloc "tikfinity")
  const T = Object.assign({
    actif: true,
    url: "ws://localhost:21213/",
    reconnexionMs: 3000,
    pseudo: "nickname",                       // "nickname" = nom affiché, "uniqueId" = @identifiant
    evenementsHabitant: ["follow", "subscribe"],
    afficherStatut: true,
    debug: false
  }, CONFIG.tikfinity || {});

  const V = window.Village;
  const badge = document.getElementById("statutTikfinity");

  const MODE_APP = new URLSearchParams(location.search).get("app") === "1";
  function statut(classe, texte) {
    badge.className = "statut " + classe + (T.afficherStatut && !MODE_APP ? "" : " cache");
    badge.textContent = texte;
    if (MODE_APP) document.title = CONFIG.titre + "  —  " + texte;   // dans l'application : affiché dans la barre de titre
  }

  /* ---------- Lire les informations d'un message ---------- */
  function pseudoDe(d) {
    const u = d.user || {};
    const nom = d.nickname || u.nickname;
    const id = d.uniqueId || u.uniqueId;
    return (T.pseudo === "uniqueId" ? (id || nom) : (nom || id)) || "Invité";
  }
  // Photo de profil (TikFinity : profilePictureUrl ; connexion directe : user.profilePicture.urls)
  function photoDe(d) {
    const u = d.user || {};
    const url = d.profilePictureUrl || u.profilePictureUrl || (u.profilePicture && u.profilePicture.urls && u.profilePicture.urls[0]) || "";
    return /^https?:\/\//i.test(url) ? url : "";
  }
  function nombre(x, defaut) {
    const n = Number(x);
    return isFinite(n) && n > 0 ? n : defaut;
  }

  function traiterCadeau(d) {
    // Cadeaux "en série" (le spectateur garde le doigt appuyé) : on ne compte
    // qu'à la fin de la série, sinon le même cadeau serait compté plusieurs fois.
    const enSerie = (d.giftType === 1 || d.giftType === "1") && d.repeatEnd === false;
    if (enSerie) return;
    V.cadeau(pseudoDe(d), d.giftName || d.name || "Cadeau", nombre(d.diamondCount, 1), nombre(d.repeatCount, 1), photoDe(d));
  }

  function traiterSocial(type, d) {
    const pseudo = pseudoDe(d);
    if (T.evenementsHabitant.indexOf(type) >= 0) V.ajouterHabitant(pseudo, photoDe(d));
    else if (type === "share") V.partage(pseudo, photoDe(d));
    // un "follow" qui n'est pas dans la liste est simplement ignoré
  }

  /* ---------- Le cœur : un message arrive ---------- */
  function traiter(message) {
    let msg = message;
    if (typeof msg === "string") {
      try { msg = JSON.parse(msg); } catch (e) { return; }
    }
    if (!msg || typeof msg !== "object") return;
    const type = String(msg.event || msg.type || "").toLowerCase();
    const d = msg.data && typeof msg.data === "object" ? msg.data : msg;
    if (T.debug) console.log("[TikFinity]", type, d);

    switch (type) {
      case "chat":      V.commentaire(pseudoDe(d), d.comment || d.message || d.text || "", photoDe(d)); break;
      case "gift":      traiterCadeau(d); break;
      case "like":      V.like(pseudoDe(d), nombre(d.likeCount, 1), photoDe(d)); break;
      case "follow":
      case "subscribe":
      case "share":     traiterSocial(type, d); break;
      default: break;                         // config, member, roomUser... : on ignore
    }
  }

  /* ---------- Connexion (avec reconnexion automatique) ---------- */
  const adresses = [T.url];                   // on essaie aussi 127.0.0.1 si "localhost" ne marche pas
  if (T.url.indexOf("localhost") >= 0) adresses.push(T.url.replace("localhost", "127.0.0.1"));
  else if (T.url.indexOf("127.0.0.1") >= 0) adresses.push(T.url.replace("127.0.0.1", "localhost"));
  let essai = 0, minuterie = null;

  function replanifier() {
    if (minuterie) return;
    essai++;
    minuterie = setTimeout(() => { minuterie = null; connecter(); }, T.reconnexionMs);
  }

  function connecter() {
    if (typeof WebSocket === "undefined") { statut("attente", "TikFinity : WebSocket indisponible"); return; }
    statut("attente", "TikFinity : connexion…");
    let socket;
    try { socket = new WebSocket(adresses[essai % adresses.length]); }
    catch (e) { replanifier(); return; }
    socket.onopen = () => statut("ok", "TikFinity : connecté");
    socket.onmessage = (ev) => traiter(ev.data);
    socket.onclose = () => { statut("attente", "TikFinity : non connecté, nouvel essai…"); replanifier(); };
    socket.onerror = () => { /* onclose sera appelé juste après */ };
  }

  /* ---------- Test sans TikFinity : faux messages au vrai format ---------- */
  function tester() {
    const n = Math.floor(100 + Math.random() * 900);
    const qui = { uniqueId: "testeur" + n, nickname: "Testeur" + n };
    const messages = [
      { event: "follow", data: Object.assign({}, qui) },
      { event: "chat",   data: Object.assign({ comment: "Message de test TikFinity !" }, qui) },
      { event: "like",   data: Object.assign({ likeCount: 15 }, qui) },
      { event: "gift",   data: Object.assign({ giftName: "Rose", diamondCount: 1, giftType: 1, repeatCount: 3, repeatEnd: false }, qui) },
      { event: "gift",   data: Object.assign({ giftName: "Rose", diamondCount: 1, giftType: 1, repeatCount: 5, repeatEnd: true }, qui) },
      { event: "share",  data: Object.assign({}, qui) }
    ];
    messages.forEach((m, i) => setTimeout(() => traiter(m), i * 1500));
  }

  document.getElementById("btnTest").addEventListener("click", tester);
  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key.toLowerCase() === "t") tester();
  });
  window.TikFinity = { traiter: traiter, tester: tester };

  /* ---------- Version Android : connexion directe au live via Euler Stream ---------- */
  // Le serveur wss://ws.eulerstream.com envoie les événements du live en JSON : { messages: [ { type, data } ] }
  // On les traduit au format TikFinity, pour que le jeu les comprenne sans rien changer.
  let socketEuler = null, minuterieEuler = null, pseudoEuler = "", cleEuler = "", arretEuler = false;
  function photoEuler(u) { return (u.profilePicture && u.profilePicture.urls && u.profilePicture.urls[0]) || u.profilePictureUrl || ""; }
  function messageEuler(type, d) {
    const u = d.user || {};
    const qui = { uniqueId: u.uniqueId || "", nickname: u.nickname || "", profilePictureUrl: photoEuler(u) };
    const t = String(type || "");
    if (/Chat/i.test(t)) traiter({ event: "chat", data: Object.assign({ comment: d.comment || d.content || "" }, qui) });
    else if (/Gift/i.test(t)) {
      const g = d.giftDetails || d.gift || {};
      traiter({ event: "gift", data: Object.assign({
        giftName: g.giftName || g.name || d.giftName || "Cadeau", diamondCount: g.diamondCount || d.diamondCount || 1,
        giftType: g.giftType != null ? g.giftType : d.giftType, repeatCount: d.repeatCount || d.comboCount || 1, repeatEnd: !!d.repeatEnd }, qui) });
    }
    else if (/Like/i.test(t)) traiter({ event: "like", data: Object.assign({ likeCount: d.likeCount || d.count || 1 }, qui) });
    else if (/Social/i.test(t)) {
      const cle = String((d.common && d.common.displayText && d.common.displayText.key) || d.displayType || d.action || "").toLowerCase();
      if (cle.indexOf("follow") >= 0) traiter({ event: "follow", data: qui });
      else if (cle.indexOf("share") >= 0) traiter({ event: "share", data: qui });
    }
  }
  function replanifierEuler(sec) {
    if (arretEuler || minuterieEuler) return;
    minuterieEuler = setTimeout(() => { minuterieEuler = null; connecterEuler(); }, sec * 1000);
  }
  function connecterEuler() {
    if (arretEuler) return;
    if (socketEuler) { try { socketEuler.onclose = null; socketEuler.close(); } catch (e) {} socketEuler = null; }
    statut("attente", "TikTok : connexion à @" + pseudoEuler + "…");
    let url = "wss://ws.eulerstream.com?uniqueId=" + encodeURIComponent(pseudoEuler);
    if (cleEuler) url += "&apiKey=" + encodeURIComponent(cleEuler);
    let ws;
    try { ws = new WebSocket(url); } catch (e) { statut("attente", "TikTok : connexion impossible — nouvel essai dans 15 s"); replanifierEuler(15); return; }
    socketEuler = ws;
    let recu = false;
    ws.onopen = () => statut("attente", "TikTok : en attente des événements de @" + pseudoEuler + "…");
    ws.onmessage = (ev) => {
      let data; try { data = JSON.parse(ev.data); } catch (e) { return; }
      if (!recu) { recu = true; statut("ok", "TikTok : connecté au live de @" + pseudoEuler + " ✅"); }
      const liste = data && Array.isArray(data.messages) ? data.messages : (Array.isArray(data) ? data : [data]);
      liste.forEach((m) => { if (m && typeof m === "object") messageEuler(m.type || m.method || m.event, m.data || m); });
    };
    ws.onclose = (e) => {
      socketEuler = null;
      if (arretEuler) return;
      const c = e.code;
      if (c === 4404) { statut("attente", "TikTok : @" + pseudoEuler + " n'est pas en live — nouvel essai dans 30 s"); replanifierEuler(30); }
      else if (c === 4401 || c === 4403) { statut("attente", "TikTok : clé Euler refusée — vérifie-la dans ⚙️"); replanifierEuler(60); }
      else if (c === 4429) { statut("attente", "TikTok : trop de connexions — nouvel essai dans 60 s"); replanifierEuler(60); }
      else if (c === 4005) { statut("attente", "TikTok : le live est terminé"); replanifierEuler(30); }
      else { statut("attente", "TikTok : déconnecté (" + c + ") — nouvel essai…"); replanifierEuler(5); }
    };
    ws.onerror = () => { /* onclose arrive juste après */ };
  }
  window.ConnexionEuler = {
    demarrer(pseudo, cle) {
      pseudoEuler = String(pseudo || "").trim().replace(/^@/, ""); cleEuler = String(cle || "").trim(); arretEuler = false;
      if (minuterieEuler) { clearTimeout(minuterieEuler); minuterieEuler = null; }
      if (!pseudoEuler) { statut("attente", "TikTok : écris ton @ dans ⚙️"); return; }
      connecterEuler();
    },
    arreter() { arretEuler = true; if (socketEuler) { try { socketEuler.close(); } catch (e) {} } }
  };
  statut("attente", "Touche LANCER pour commencer");
})();

</script>
<script>
/* ===== android.js ===== */
"use strict";
/* ============================================================
   android.js — VERSION TÉLÉPHONE
   - écran de lancement : ton @ TikTok (+ clé Euler Stream facultative)
   - plein écran, écran toujours allumé pendant le live
   - petit bouton ⚙️ dans le coin pour revenir aux réglages et aux boutons démo
   ============================================================ */
(function () {
  const lire = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
  const ecrire = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  const css = document.createElement("style");
  css.textContent = `
  #lancement { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    background: rgba(18,12,24,.88); font-family: 'Baloo 2', sans-serif; color: #fff; padding: 20px; }
  #lancement.cache { display: none; }
  #lancement .boite { width: min(420px, 100%); background: #241a30; border: 3px solid #ffc857; border-radius: 22px; padding: 18px 18px 16px; }
  #lancement h1 { font-size: 30px; line-height: 1.1; text-align: center; color: #ffd43b; margin-bottom: 4px; }
  #lancement p { font-size: 15px; line-height: 1.3; color: #d8cce6; margin: 6px 0 12px; text-align: center; }
  #lancement label { display: block; font-size: 15px; font-weight: 700; margin: 10px 0 4px; }
  #lancement input { width: 100%; font: 700 20px 'Baloo 2', sans-serif; padding: 8px 12px; border-radius: 12px; border: 2px solid #6b5a80; background: #fff; color: #17131f; }
  #lancement small { display: block; font-size: 13px; color: #b9a9cc; margin-top: 4px; line-height: 1.25; }
  #lancement button { width: 100%; margin-top: 12px; font: 800 22px 'Baloo 2', sans-serif; padding: 10px; border: 0; border-radius: 14px; cursor: pointer; }
  #lancement .go { background: #40c057; color: #fff; }
  #lancement .second { background: #ffc857; color: #2a1a00; font-size: 17px; padding: 8px; }
  #engrenage { position: fixed; right: 6px; bottom: 6px; z-index: 90; width: 34px; height: 34px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 18px; opacity: .35; }
  #demo { bottom: 48px; }
  `;
  document.head.appendChild(css);

  const div = document.createElement("div");
  div.id = "lancement";
  div.innerHTML = `
    <div class="boite">
      <h1>🎪 LE FUNAMBULE</h1>
      <p>Lance d'abord ton live TikTok en <b>partage d'écran</b>, reviens ici, puis touche LANCER.<br>Sur iPhone : ouvre le jeu depuis son icône sur l'écran d'accueil pour avoir le plein écran.</p>
      <label for="champPseudo">Ton @ TikTok</label>
      <input id="champPseudo" autocomplete="off" autocapitalize="off" spellcheck="false">
      <label for="champCle">Clé Euler Stream (facultatif)</label>
      <input id="champCle" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="laisse vide pour essayer sans">
      <small>Si « trop de connexions » ou « clé refusée » s'affiche, crée une clé gratuite sur eulerstream.com et colle-la ici.</small>
      <button class="go" id="btnLancer">▶ LANCER</button>
      <button class="second" id="btnDemoTel">Afficher / masquer les boutons de test</button>
    </div>`;
  document.body.appendChild(div);
  const champPseudo = document.getElementById("champPseudo"), champCle = document.getElementById("champCle");
  champPseudo.value = lire("tel_pseudo", (CONFIG.connexion && CONFIG.connexion.pseudoTikTok) || "");
  champCle.value = lire("tel_cle", (CONFIG.connexion && CONFIG.connexion.cleEuler) || "");

  // Écran toujours allumé (sinon le téléphone se met en veille pendant le live)
  let verrou = null;
  async function garderEcranAllume() {
    try { if ("wakeLock" in navigator && !verrou) { verrou = await navigator.wakeLock.request("screen"); verrou.addEventListener("release", () => { verrou = null; }); } } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && lance) garderEcranAllume(); });

  let lance = false;
  document.getElementById("btnLancer").addEventListener("click", async () => {
    const pseudo = champPseudo.value.trim().replace(/^@/, ""), cle = champCle.value.trim();
    ecrire("tel_pseudo", pseudo); ecrire("tel_cle", cle);
    div.classList.add("cache");
    try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen({ navigationUI: "hide" }); } catch (e) {}
    try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("portrait"); } catch (e) {}
    lance = true; garderEcranAllume();
    window.ConnexionEuler.demarrer(pseudo, cle);
  });
  document.getElementById("btnDemoTel").addEventListener("click", () => document.getElementById("demo").classList.toggle("cache"));

  const roue = document.createElement("button");
  roue.id = "engrenage"; roue.textContent = "⚙️"; roue.setAttribute("aria-label", "Réglages");
  roue.addEventListener("click", () => div.classList.toggle("cache"));
  document.body.appendChild(roue);

  // La pastille de connexion disparaît quand tout va bien (pour ne pas gêner l'image du live)
  const pastille = document.getElementById("statutTikfinity");
  new MutationObserver(() => {
    if (pastille.classList.contains("ok")) { clearTimeout(pastille._t); pastille._t = setTimeout(() => { if (pastille.classList.contains("ok")) pastille.style.display = "none"; }, 5000); }
    else pastille.style.display = "";
  }).observe(pastille, { attributes: true, attributeFilter: ["class"] });
})();

</script>
</body>
